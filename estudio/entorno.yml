# Entorno del estudio (conda-forge). Probado en macOS con chip Apple (arm64) y en Linux x86-64.
name: sipsa-final
channels:
  - conda-forge
dependencies:
  - python=3.13
  - numpy=2.5.3
  - pandas=2.3.3
  - pyarrow=26.0.0
  - scipy=1.18.1
  - scikit-learn=1.9.1
  - imbalanced-learn=0.14.2
  - lightgbm=4.7.0        # incluye OpenMP (llvm-openmp); no requiere Homebrew
  - xgboost=3.4.2
  - catboost=1.2.10
  - statsforecast=2.1.1
  - matplotlib-base=3.11.2
  - joblib=1.6.0
